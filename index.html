<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Q-Jong">
    <title>Q-Jong</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon.png?v=2" sizes="1024x1024">
    <link rel="icon" type="image/png" href="assets/icon.png?v=2">
    <link rel="stylesheet" href="assets/css/style.css?v=46.1">
    <script src="assets/js/header-clock.js?v=46.1" defer></script>
    <script src="assets/js/treasure-rain.js?v=46.1" defer></script>
</head>
<body>
    <header class="hero" data-scene="battle">
        <div class="hero-scene" aria-hidden="true"></div>
        <div class="hero-veil" aria-hidden="true"></div>
        <div class="hero-inner">
            <h1 class="header-clock" id="header-clock">
                <span class="header-clock-time" data-clock-time>--:--:--</span>
                <span class="header-clock-date" data-clock-date>読み込み中</span>
            </h1>
        </div>
    </header>

    <main>
        <div class="deck-bar">
            <div id="attendance-bar" class="deck-bar-slot"></div>
            <div class="deck-bar-actions">
                <button type="button" id="home-bonus-button" class="deck-bar-bonus" hidden>ボーナス</button>
                <button type="button" id="refresh-button">更新</button>
            </div>
        </div>

        <div class="ranking-scroll-wrapper">
            <div class="ranking-panel" data-scene="treasure">
                <h2> 現在のレートランキング </h2>
                <div id="scores-container">
                    <div class="loading-placeholder" role="status" aria-label="ランキングを読み込み中">
                        <div class="skeleton skeleton-row"></div>
                        <div class="skeleton skeleton-row"></div>
                        <div class="skeleton skeleton-row"></div>
                    </div>
                </div>
                <p class="update-info" id="last-update"></p>
            </div>
        </div>

        <div class="info-box mt-20" id="rate-chart-section">
            <h3 class="icon-title">レートの推移</h3>
            <div id="rate-chart">
                <div class="loading-placeholder" role="status" aria-label="レート推移を読み込み中">
                    <div class="skeleton skeleton-row"></div>
                    <div class="skeleton skeleton-row"></div>
                </div>
            </div>
        </div>

        <div class="home-campus-grid mt-20">
            <div class="info-box home-campus-box home-cafeteria-box" data-scene="tavern">
                <h3 class="icon-title">📷 学生食堂情報</h3>
                <div class="cafeteria-layout">
                    <div class="cafeteria-panel">
                        <p class="cafeteria-label">今週のメニュー</p>
                        <iframe id="tsudanuma-menu" class="cafeteria-pdf"
                                title="津田沼 学生食堂メニュー" loading="lazy"></iframe>
                        <a id="tsudanuma-menu-link" class="cafeteria-pdf-link"
                           href="https://www.cit-s.com/wp/wp-content/themes/cit/syokudo/t.pdf"
                           target="_blank" rel="noopener">PDFを開く</a>
                    </div>
                </div>
            </div>

            <div class="info-box home-campus-box" id="home-manaba-section" data-scene="jail">
                <h3 class="icon-title">manaba 未提出課題</h3>
                <p id="home-manaba-message" class="hidden" aria-live="polite"></p>
                <div id="home-manaba-assignment-list">
                    <div class="loading-placeholder" role="status" aria-label="manaba課題を読み込み中">
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-row"></div>
                        <div class="skeleton skeleton-row"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="info-box mt-20 home-events-section" data-scene="auction">
            <h3 class="icon-title">開催中のイベント</h3>
            <div class="home-event-group">
                <h4>宝くじ</h4>
                <div id="lottery-list-container">
                    <div class="loading-placeholder" role="status" aria-label="宝くじデータを読み込み中">
                        <div class="skeleton skeleton-row"></div>
                    </div>
                </div>
            </div>
            <div class="home-event-group">
                <h4>スポーツくじ</h4>
                <div id="sports-bets-container">
                    <div class="loading-placeholder" role="status" aria-label="くじデータを読み込み中">
                        <div class="skeleton skeleton-row"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer>
        <nav class="footer-nav" aria-label="メインメニュー">
            <a href="index.html"  class="input-link" aria-current="page"><span class="nav-icon" data-icon="home" aria-hidden="true"></span><span>ホーム</span></a>
            <a href="game.html"   class="input-link"><span class="nav-icon" data-icon="game" aria-hidden="true"></span><span>ゲーム</span></a>
            <a href="mypage.html" class="input-link"><span class="nav-icon" data-icon="mypage" aria-hidden="true"></span><span>マイページ</span></a>
            <a href="admin.html" class="input-link" data-master-only hidden><span class="nav-icon" data-icon="admin" aria-hidden="true"></span><span>管理</span></a>
        </nav>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/common.js?v=46.1"></script>
    <script src="assets/js/main.js?v=46.1"></script>
    <script src="assets/js/rate-chart.js?v=46.1"></script>
</body>
</html>
